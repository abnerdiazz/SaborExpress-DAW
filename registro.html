<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SaborExpress - Crear Cuenta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login-mispedidos.css">
</head>
<body class="login-page d-flex align-items-center justify-content-center">

    <div class="card login-card p-4 p-md-5" style="max-width: 420px;">

        <h1 class="fs-4 fw-bold mb-1">Crear cuenta nueva</h1>
        <p class="text-muted small mb-4">Regístrate para ordenar tus pupusas favoritas calentitas directo a tu domicilio.</p>

        <div id="registroError" class="form-error d-none" role="alert"></div>

        <form id="registroForm" novalidate>
            <div class="mb-3">
                <label class="form-label-soft d-block" for="registroNombre">Nombre Completo</label>
                <input id="registroNombre" type="text" class="form-control form-control-soft" placeholder="Juan Pérez" autocomplete="name" maxlength="60" required>
            </div>
            <div class="mb-3">
                <label class="form-label-soft d-block" for="registroCorreo">Correo Electrónico</label>
                <input id="registroCorreo" type="email" class="form-control form-control-soft" placeholder="juan.perez@correo.com" autocomplete="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label-soft d-block" for="registroTelefono">Teléfono (WhatsApp)</label>
                <input id="registroTelefono" type="tel" class="form-control form-control-soft" placeholder="7777-7777" inputmode="numeric" autocomplete="tel" maxlength="9" required>
            </div>
            <div class="mb-3">
                <label class="form-label-soft d-block" for="registroPassword">Contraseña</label>
                <input id="registroPassword" type="password" class="form-control form-control-soft" placeholder="Mínimo 8 caracteres, con letras y números" autocomplete="new-password" required minlength="8">
                <div id="passwordMeter" class="password-meter" aria-live="polite"></div>
            </div>
            <div class="mb-4">
                <label class="form-label-soft d-block" for="registroConfirmar">Confirmar Contraseña</label>
                <input id="registroConfirmar" type="password" class="form-control form-control-soft" placeholder="Repetir contraseña" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="btn btn-brand w-100">Registrarse</button>
        </form>

        <p class="text-center mt-3 mb-0 small">
            ¿Ya tienes cuenta? <a href="login.html" class="login-link">Inicia sesión</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/registro.js"></script>
</body>
</html>
