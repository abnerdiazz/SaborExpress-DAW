<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SaborExpress Admin - Menú</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="css/contacto-adminpedidos.css">
    <link rel="stylesheet" href="css/carrito-adminmenu.css">
</head>
<body class="admin-wireframe-page">

    <nav class="navbar navbar-expand-lg admin-wireframe-navbar sticky-top" aria-label="Navegación administrativa">
        <div class="container-fluid px-3 px-lg-5">
            <a class="navbar-brand admin-wireframe-brand" href="admin-pedidos.html">
                <img src="img/logo.png" alt="Logo de SaborExpress" class="brand-logo" width="48" height="48">
                <span>SaborExpress Admin</span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar" aria-controls="adminNavbar" aria-expanded="false" aria-label="Abrir navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
                    <li class="nav-item"><a class="nav-link" href="admin-pedidos.html">Pedidos</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="admin-menu.html">Menú</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-reportes.html">Reportes</a></li>
                    <li class="nav-item dropdown ms-lg-2">
                        <button class="btn admin-account-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1"></i>
                            <span data-admin-name>Administrador</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><span class="dropdown-item-text small text-secondary" data-admin-email>admin@saborexpress.com</span></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button class="dropdown-item text-danger" type="button" data-admin-logout><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="admin-wireframe-main">
        <div class="container-fluid px-3 px-lg-5">
            
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
                <div>
                    <h1 class="admin-wireframe-title">Menú</h1>
                    <p class="admin-wireframe-subtitle">Gestión de platillos y precios disponibles al público.</p>
                </div>
                <div>
                    <button type="button" class="btn btn-add-product" data-bs-toggle="modal" data-bs-target="#modalAddProduct">
                        + Añadir Producto
                    </button>
                </div>
            </div>

            <!-- Grilla de Tarjetas -->
            <div class="row g-4" id="admin-menu-grid"></div>
        </div>
    </main>

    <!-- Añadir Producto -->
    <div class="modal fade" id="modalAddProduct" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Añadir Nuevo Producto al Menú</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="form-add-product" novalidate>
                        
                        <div class="mb-3">
                            <label class="form-label text-uppercase fs-7 fw-bold" for="new-prod-name">Seleccionar Producto</label>
                            <select class="form-select" id="new-prod-name" required>
                                <option value="" selected disabled>-- Selecciona un platillo o bebida --</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-uppercase fs-7 fw-bold" for="new-prod-price">Precio ($)</label>
                            <input type="number" step="0.01" class="form-control" id="new-prod-price" min="0.1" max="99" required placeholder="0.85">
                        </div>

                        <div id="addProductError" class="alert alert-danger py-2 small d-none" role="alert"></div>

                        <div class="text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-brand fw-bold">Guardar Producto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin-menu.js"></script>
</body>
</html>
